name: ${COMPOSE_PROJECT_NAME:?Initialize a deployment workspace first}
services:
  database:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: ai_manager
      MYSQL_USER: ai_manager
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app
    secrets: [mysql_root, mysql_app]
    volumes: [business-data:/var/lib/mysql]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    networks: [internal]
  identity-database:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/identity_root
      MYSQL_PASSWORD_FILE: /run/secrets/identity_app
    secrets: [identity_root, identity_app]
    volumes: [identity-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    networks: [internal]
  identity:
    image: ${IDENTITY_IMAGE:?Set IDENTITY_IMAGE}
    build:
      context: ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy
      dockerfile: containers/keycloak.Dockerfile
      args:
        KEYCLOAK_BASE_IMAGE: ${KEYCLOAK_BASE_IMAGE:?Set KEYCLOAK_BASE_IMAGE}
    user: "${APP_UID:?Set APP_UID}:${APP_GID:?Set APP_GID}"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://identity-database:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${PUBLIC_URL:?Set PUBLIC_URL}/identity
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_CACHE: local
    secrets: [identity_app, bootstrap_admin]
    volumes:
      - ${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/realm.json:/opt/keycloak/data/import/ai-manager-realm.json:ro
    tmpfs:
      - /tmp:mode=1777
      - /opt/keycloak/data:mode=1777
    depends_on:
      identity-database: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/bash, /opt/keycloak/bin/manager-health.sh]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    security_opt: [no-new-privileges:true]
    networks: [internal]
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    build:
      context: ${BACKEND_BUILD_CONTEXT:?Set BACKEND_BUILD_CONTEXT}
      dockerfile: ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy/containers/backend.Dockerfile
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?Set JAVA_RUNTIME_IMAGE}
    user: "${APP_UID:?Set APP_UID}:${APP_GID:?Set APP_GID}"
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DATABASE_URL: jdbc:mysql://database:3306/ai_manager?connectionTimeZone=UTC
      DATABASE_USERNAME: ai_manager
      OIDC_ISSUER_URI: ${PUBLIC_URL:?Set PUBLIC_URL}/identity/realms/ai-manager
      OIDC_JWK_SET_URI: http://identity:8080/identity/realms/ai-manager/protocol/openid-connect/certs
      OIDC_AUDIENCE: ai-manager-api
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      CONFIGURATION_SIGNING_KEY_FILE: /run/keys/signing.jwk
      CONFIGURATION_VERIFICATION_KEYS_FILE: /run/keys/verification.jwks
      KAFKA_NOTIFICATIONS_ENABLED: "false"
      ARTEMIS_NOTIFICATIONS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    secrets:
      - source: mysql_app
        target: spring.datasource.password
      - source: signing_key
        target: /run/keys/signing.jwk
      - source: verification_keys
        target: /run/keys/verification.jwks
    depends_on:
      database: {condition: service_healthy}
      identity: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:mode=1777]
    restart: unless-stopped
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
  edge:
    image: ${EDGE_IMAGE:?Set EDGE_IMAGE}
    build:
      context: ${GUARDIAN_BUILD_CONTEXT:?Set GUARDIAN_BUILD_CONTEXT}
      dockerfile: ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy/containers/edge.Dockerfile
      args:
        EDGE_BASE_IMAGE: ${EDGE_BASE_IMAGE:?Set EDGE_BASE_IMAGE}
    user: "${APP_UID:?Set APP_UID}:${APP_GID:?Set APP_GID}"
    ports: ["${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:?Set EDGE_PORT}:8080"]
    volumes:
      - ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy/edge/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT}/deploy/edge/routes.conf:/etc/nginx/includes/routes.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:mode=1777, /var/cache/nginx:mode=1777]
    restart: unless-stopped
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal, edge]
secrets:
  mysql_root: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/mysql_root"}
  mysql_app: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/mysql_app"}
  identity_root: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/identity_root"}
  identity_app: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/identity_app"}
  bootstrap_admin: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/bootstrap_admin"}
  signing_key: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/secrets/signing.jwk"}
  verification_keys: {file: "${DEPLOYMENT_ROOT:?Set DEPLOYMENT_ROOT}/verification.jwks"}
volumes:
  business-data:
  identity-data:
networks:
  internal: {internal: true}
  edge:
