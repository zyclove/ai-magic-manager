pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OIDC codes/state and all query parameters are deliberately absent.
    log_format manager '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout manager;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream manager_backend { zone manager_backend 64k; server backend:8080 resolve; }
    upstream manager_identity { zone manager_identity 64k; server identity:8080 resolve; }
    map $scheme $manager_hsts { default ""; https "max-age=31536000"; }
    include /etc/nginx/conf.d/*.conf;
}
