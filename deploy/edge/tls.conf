# Internal health port does not provide application or identity access.
server {
    listen 8080;
    server_name _;
    location = /healthz { access_log off; return 200 'ready\n'; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    include /etc/nginx/includes/routes.conf;
}
