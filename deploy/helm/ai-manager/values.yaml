# Replace every empty required value in a private values file. Do not commit secrets.
publicOrigin: ""
images:
  backend: ""
  edge: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
database:
  jdbcUrl: ""
  username: ""
  existingSecret: ""
  passwordKey: spring.datasource.password
erasureLedger:
  # Provision explicitly in an independent MySQL database; runtime never initializes it.
  jdbcUrl: ""
  username: ""
  id: ""
  existingSecret: ""
  passwordKey: password
identity:
  # Existing HTTP Service in this namespace, serving Keycloak at /identity.
  serviceName: ""
  servicePort: 8080
  audience: ai-manager-api
signing:
  existingSecret: ""
  privateKeyKey: signing.jwk
  publicKeysKey: verification.jwks
contract:
  # China institution contracts: disable new facts until a qualified signer is connected.
  evidenceEnabled: false
  activeSubmissionsEnabled: false
  issuer: ""
  audience: ""
  jwkSetUri: ""
ingress:
  enabled: true
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}
api:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
worker:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
edge:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
