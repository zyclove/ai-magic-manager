apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-manager.name" . }}-edge
  labels:
    {{- include "ai-manager.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    error_log /dev/stderr warn;
    events { worker_connections 4096; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format manager '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
      access_log /dev/stdout manager;
      server_tokens off;
      sendfile on;
      keepalive_timeout 65;
      map $http_x_forwarded_proto $manager_hsts { default ""; https "max-age=31536000"; }
      server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $manager_hsts always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ready\n'; }
        location ^~ /api/ { return 404; }
        location ^~ /identity/ { return 404; }
        location / {
          try_files $uri $uri/ /index.html;
          add_header Cache-Control "no-cache";
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy no-referrer always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
          add_header Strict-Transport-Security $manager_hsts always;
          add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        }
      }
    }
