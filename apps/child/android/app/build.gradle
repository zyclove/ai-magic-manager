plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.aimanager.child"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.aimanager.child"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // Release credentials are deployment inputs, never checked into Git. A
    // release task must fail rather than silently ship with Android debug keys.
    def signingInputs = ["CHILD_SIGNING_STORE", "CHILD_SIGNING_STORE_PASSWORD",
                         "CHILD_SIGNING_KEY_ALIAS", "CHILD_SIGNING_KEY_PASSWORD"]
    def hasReleaseSigning = signingInputs.every { System.getenv(it)?.trim() }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv("CHILD_SIGNING_STORE"))
                storePassword System.getenv("CHILD_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("CHILD_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("CHILD_SIGNING_KEY_PASSWORD")
            }
        }
    }
    kotlinOptions { jvmTarget = "17" }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release { if (hasReleaseSigning) signingConfig = signingConfigs.release }
    }
    gradle.taskGraph.whenReady { graph ->
        if (!hasReleaseSigning && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
            throw new GradleException("Child release requires explicit external signing configuration.")
        }
    }
}

flutter {
    source = "../.."
}
