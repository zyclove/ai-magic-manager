plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Credentials are supplied by the institution's secret store at build time.
// An absent key must never silently produce an unsigned or debug-signed release.
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains("release")
}
def releaseStore = System.getenv("PARENT_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("PARENT_ANDROID_STORE_PASSWORD")
def releaseAlias = System.getenv("PARENT_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("PARENT_ANDROID_KEY_PASSWORD")
def signingConfigured = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }
// EMAS mobile credentials only. Never embed server RAM access keys in an APK.
def pushEnabled = System.getenv("PARENT_ALIYUN_PUSH_ENABLED") == "true"
def pushAppKey = System.getenv("PARENT_ALIYUN_PUSH_APP_KEY") ?: ""
def pushAppSecret = System.getenv("PARENT_ALIYUN_PUSH_APP_SECRET") ?: ""
if (pushEnabled && (!pushAppKey.matches("[0-9]{5,32}") || !pushAppSecret.matches("[A-Za-z0-9]{16,128}"))) {
    throw new GradleException("Enabled parent push requires valid EMAS mobile application credentials")
}
if (!pushEnabled) { pushAppKey = ""; pushAppSecret = "" }
if (releaseRequested && !signingConfigured) {
    throw new GradleException("Parent release signing requires the four PARENT_ANDROID_* environment variables")
}
if (releaseRequested &&
    (!new File(releaseStore).isAbsolute() || !file(releaseStore).isFile())) {
    throw new GradleException("Parent release signing keystore must be an existing absolute file")
}

android {
    namespace = "com.aimanager.parent"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { buildConfig = true }

    defaultConfig {
        applicationId = "com.aimanager.parent"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders += ['appAuthRedirectScheme': 'com.aimanager.parent']
        def wechatAppId = System.getenv("PARENT_WECHAT_APP_ID") ?: ""
        if (!wechatAppId.isEmpty() && !wechatAppId.matches("wx[0-9a-fA-F]{16}")) {
            throw new GradleException("PARENT_WECHAT_APP_ID must be a registered WeChat app ID")
        }
        buildConfigField "String", "WECHAT_APP_ID", '"' + wechatAppId + '"'
        buildConfigField "boolean", "ALIYUN_PUSH_ENABLED", pushEnabled.toString()
        buildConfigField "String", "ALIYUN_PUSH_APP_KEY", '"' + pushAppKey + '"'
        buildConfigField "String", "ALIYUN_PUSH_APP_SECRET", '"' + pushAppSecret + '"'
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile = file(releaseStore)
                storePassword = releaseStorePassword
                keyAlias = releaseAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigured) signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "com.aliyun.ams:alicloud-android-push:3.10.1"
    implementation "com.tencent.mm.opensdk:wechat-sdk-android:6.8.40"
    testImplementation "junit:junit:4.13.2"
}
