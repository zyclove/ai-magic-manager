plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Credentials are supplied by the institution's secret store at build time.
// An absent key must never silently produce an unsigned or debug-signed release.
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(java.util.Locale.ROOT).contains("release")
}
def releaseStore = System.getenv("PARENT_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("PARENT_ANDROID_STORE_PASSWORD")
def releaseAlias = System.getenv("PARENT_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("PARENT_ANDROID_KEY_PASSWORD")
def signingConfigured = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }
if (releaseRequested && !signingConfigured) {
    throw new GradleException("Parent release signing requires the four PARENT_ANDROID_* environment variables")
}
if (releaseRequested &&
    (!new File(releaseStore).isAbsolute() || !file(releaseStore).isFile())) {
    throw new GradleException("Parent release signing keystore must be an existing absolute file")
}

android {
    namespace = "com.aimanager.parent"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId = "com.aimanager.parent"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders += ['appAuthRedirectScheme': 'com.aimanager.parent']
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile = file(releaseStore)
                storePassword = releaseStorePassword
                keyAlias = releaseAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigured) signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
